name: mastodon

services:
  mastodon-db:
    image: postgres:16-alpine
    container_name: mastodon-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=mastodon
      - POSTGRES_USER=mastodon
      - POSTGRES_PASSWORD=${MASTODON_DB_PASSWORD}
    volumes:
      - /opt/homelab/mastodon/postgres:/var/lib/postgresql/data
    networks:
      - mastodon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastodon"]
      interval: 10s
      timeout: 5s
      retries: 5

  mastodon-redis:
    image: redis:7-alpine
    container_name: mastodon-redis
    restart: unless-stopped
    volumes:
      - /opt/homelab/mastodon/redis:/data
    networks:
      - mastodon
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mastodon-web:
    image: ghcr.io/mastodon/mastodon:latest
    container_name: mastodon-web
    restart: unless-stopped
    command: bundle exec puma -C config/puma.rb
    env_file: ../.env
    environment:
      - LOCAL_DOMAIN=${DOMAIN}
      - SECRET_KEY_BASE=${MASTODON_SECRET_KEY_BASE}
      - OTP_SECRET=${MASTODON_OTP_SECRET}
      - VAPID_PRIVATE_KEY=${MASTODON_VAPID_PRIVATE_KEY}
      - VAPID_PUBLIC_KEY=${MASTODON_VAPID_PUBLIC_KEY}
      - DB_HOST=mastodon-db
      - DB_NAME=mastodon
      - DB_USER=mastodon
      - DB_PASS=${MASTODON_DB_PASSWORD}
      - REDIS_URL=redis://mastodon-redis:6379
      - SMTP_SERVER=${MASTODON_SMTP_SERVER}
      - SMTP_PORT=${MASTODON_SMTP_PORT}
      - SMTP_LOGIN=${MASTODON_SMTP_LOGIN}
      - SMTP_PASSWORD=${MASTODON_SMTP_PASSWORD}
      - SMTP_FROM_ADDRESS=${MASTODON_SMTP_FROM_ADDRESS}
    volumes:
      - /opt/homelab/mastodon/public:/mastodon/public/system
    ports:
      - "3001:3000"
    depends_on:
      mastodon-db:
        condition: service_healthy
      mastodon-redis:
        condition: service_healthy
    networks:
      - mastodon

  mastodon-streaming:
    image: ghcr.io/mastodon/mastodon-streaming:latest
    container_name: mastodon-streaming
    restart: unless-stopped
    env_file: ../.env
    environment:
      - LOCAL_DOMAIN=${DOMAIN}
      - DB_HOST=mastodon-db
      - DB_NAME=mastodon
      - DB_USER=mastodon
      - DB_PASS=${MASTODON_DB_PASSWORD}
      - REDIS_URL=redis://mastodon-redis:6379
    ports:
      - "4000:4000"
    depends_on:
      mastodon-db:
        condition: service_healthy
      mastodon-redis:
        condition: service_healthy
    networks:
      - mastodon

  mastodon-sidekiq:
    image: ghcr.io/mastodon/mastodon:latest
    container_name: mastodon-sidekiq
    restart: unless-stopped
    command: bundle exec sidekiq
    env_file: ../.env
    environment:
      - LOCAL_DOMAIN=${DOMAIN}
      - SECRET_KEY_BASE=${MASTODON_SECRET_KEY_BASE}
      - OTP_SECRET=${MASTODON_OTP_SECRET}
      - DB_HOST=mastodon-db
      - DB_NAME=mastodon
      - DB_USER=mastodon
      - DB_PASS=${MASTODON_DB_PASSWORD}
      - REDIS_URL=redis://mastodon-redis:6379
      - SMTP_SERVER=${MASTODON_SMTP_SERVER}
      - SMTP_PORT=${MASTODON_SMTP_PORT}
      - SMTP_LOGIN=${MASTODON_SMTP_LOGIN}
      - SMTP_PASSWORD=${MASTODON_SMTP_PASSWORD}
      - SMTP_FROM_ADDRESS=${MASTODON_SMTP_FROM_ADDRESS}
    volumes:
      - /opt/homelab/mastodon/public:/mastodon/public/system
    depends_on:
      mastodon-db:
        condition: service_healthy
      mastodon-redis:
        condition: service_healthy
    networks:
      - mastodon

networks:
  mastodon:
    driver: bridge
