---
- name: Windrose サーバをビルド・起動
  hosts: app
  become: false
  vars:
    deploy_path: /opt/homelab

  tasks:
    - name: Windrose データディレクトリを作成
      become: true
      file:
        path: /opt/homelab/game/windrose
        state: directory
        mode: '0777'

    - name: services ファイルをサーバに同期（Dockerfile 更新を反映）
      become: true
      copy:
        src: "{{ playbook_dir }}/../services/"
        dest: "{{ deploy_path }}/services/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Makefile をサーバに同期
      become: true
      copy:
        src: "{{ playbook_dir }}/../Makefile"
        dest: "{{ deploy_path }}/Makefile"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"

    - name: Windrose Docker イメージをビルド
      shell: >
        docker compose --env-file .env -f compose/game_windrose.yml build
        --build-arg STEAM_USER={{ steam_user | default('anonymous') }}
        --build-arg STEAM_PASS="{{ steam_pass | default('') }}"
      args:
        chdir: "{{ deploy_path }}"
      register: build_result
      changed_when: true

    - name: ビルド結果を表示
      debug:
        var: build_result.stdout_lines

    - name: Windrose サーバを起動
      shell: make up-game-windrose
      args:
        chdir: "{{ deploy_path }}"
      register: start_result
      changed_when: true

    - name: 起動結果を表示
      debug:
        var: start_result.stdout_lines
