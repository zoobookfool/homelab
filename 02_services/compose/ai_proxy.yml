name: ai-proxy

services:
  ai-proxy:
    image: nginx:alpine
    container_name: ai-proxy
    restart: unless-stopped
    environment:
      - LOCAL_PC_TAILSCALE_IP=${LOCAL_PC_TAILSCALE_IP}
      - OLLAMA_PORT=${OLLAMA_PORT}
    volumes:
      - ../services/ai_proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${DOCKER_BIND_IP:-127.0.0.1}:11435:11435"
    networks:
      - ai-proxy

networks:
  ai-proxy:
    driver: bridge
