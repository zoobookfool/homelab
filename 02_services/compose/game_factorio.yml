name: factorio

services:
  factorio:
    image: factoriotools/factorio:1.1
    container_name: factorio
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - /opt/homelab/game/factorio:/factorio
    ports:
      # GAME_BIND_IP は .env で設定（パターンA: 空欄=全公開 / パターンB: Tailscale IP）
      - "${GAME_BIND_IP:-0.0.0.0}:34197:34197/udp"
    networks:
      - factorio

networks:
  factorio:
    driver: bridge
