---
- name: Nginx をインストール
  apt:
    name: nginx
    state: present
    update_cache: true

- name: Certbot をインストール
  apt:
    name:
      - certbot
      - python3-certbot-nginx
    state: present

- name: Nginx を起動・自動起動設定
  systemd:
    name: nginx
    state: started
    enabled: true

# 事前に各サブドメインの A レコードがこのサーバを向いている必要がある。
# 取得後の更新は certbot パッケージ付属の systemd タイマーが自動で行う。
- name: Let's Encrypt 証明書を取得（初回のみ）
  command: >
    certbot certonly --nginx --non-interactive --agree-tos
    -m {{ certbot_email }}
    --cert-name {{ domain }}
    {% for sub in certbot_subdomains %} -d {{ sub }}.{{ domain }}{% endfor %}
  args:
    creates: "/etc/letsencrypt/live/{{ domain }}/fullchain.pem"

- name: Nginx 設定ファイルを配置
  template:
    src: "{{ item }}.conf.j2"
    dest: "/etc/nginx/conf.d/{{ item }}.conf"
    mode: "0644"
  loop:
    - mastodon
    - element
    - monitoring
    - ai_proxy
  notify: nginx reload

- name: Nginx の設定テスト
  command: nginx -t
  changed_when: false
