---
- name: Tailscale をインストール（公式スクリプト）
  ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
  args:
    creates: /usr/bin/tailscale

- name: Tailscale を起動・自動起動設定
  systemd:
    name: tailscaled
    state: started
    enabled: true

# tailscaled.state はデーモン起動だけで作成されるため、creates では参加済み判定にならない。
# tailscale status は未参加（ログアウト・停止）時に非ゼロを返すことを利用する
- name: Tailscale の参加状態を確認
  command: tailscale status
  register: tailscale_status
  failed_when: false
  changed_when: false

- name: Tailscale でネットワークに参加
  command: tailscale up --authkey={{ tailscale_auth_key }} --accept-routes
  when: tailscale_status.rc != 0
