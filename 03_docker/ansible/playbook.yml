---
- name: Docker・Docker Compose インストール
  hosts: app
  become: true

  tasks:
    - name: curl をインストール
      apt:
        name: curl
        state: present
        update_cache: true

    - name: Docker をインストール（公式スクリプト）
      ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: Docker を起動・自動起動設定
      systemd:
        name: docker
        state: started
        enabled: true

    - name: ユーザーを docker グループに追加
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
